<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Ecostock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
</head>
<body class="auth-page">

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo"><i class="bi bi-box-seam-fill"></i> Ecostock</a>
            <div class="nav-actions">
                <a href="register.html" class="btn btn-primary">Registrarse</a>
            </div>
        </div>
    </nav>

    <main class="auth-main">
        <div class="auth-card">
            <h1>Bienvenido de vuelta</h1>
            <p class="muted">Entra para ver el panel de tu negocio.</p>

            <form id="login" class="auth-form">
                <div id="error" class="error" role="alert" hidden></div>
                <label class="field"><span>Correo electrónico</span>
                    <input name="correo" type="email" autocomplete="email" required>
                </label>
                <label class="field"><span>Contraseña</span>
                    <input name="pass" type="password" autocomplete="current-password" required>
                </label>
                <button class="btn btn-primary btn-block">Iniciar sesión</button>
            </form>

            <p class="auth-foot">¿Aún no tienes cuenta? <a href="register.html" class="link">Regístrate gratis</a></p>
        </div>
    </main>

    <script src="js/comun.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
